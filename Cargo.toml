[package]
name = "model-registry"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.13"
aws-credential-types = "1.3"
aws-sdk-s3 = "1.157"
blake3 = "1.8"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
futures-util = "0.3"
http-body = "1"
indicatif = "0.18"
console = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
walkdir = "2.5"
clap_complete = "4"


[dev-dependencies]
tempfile = "3.27"

[lib]
name = "model_registry"
path = "src/lib.rs"

[[bin]]
name = "mr"
path = "src/main.rs"
